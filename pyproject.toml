[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-ripple"
version = "0.1.0"
description = "Find artifacts affected by a changed decision."
requires-python = ">=3.11"
authors = [{name = "Anuj Sadani"}]
readme = "README.md"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
decision-ripple = "decision_ripple.__main__:main"

[tool.setuptools.packages.find]
include = ["decision_ripple*"]
